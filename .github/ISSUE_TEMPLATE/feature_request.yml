name: Feature request
description: Something SimuPy should be able to do and cannot
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        `docs/limitations.rst` lists what is deliberately absent and why. If
        what you want is in there, say so and argue the case — that page is a
        record of decisions, not a closed door.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The modelling problem, not the feature. Knowing what you are actually
        building often turns up a better answer than the one asked for.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you work around it today
      description: What you do instead, and where that stops being good enough.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: >
        Optional. If another tool does this well, naming it and saying what it
        gets right helps more than a specification.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues
          required: true
        - label: I checked docs/limitations.rst
          required: true
