name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python build and runtime dependencies
        run: python -m pip install --upgrade pip pybind11 numpy pyserial

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          # Qt6Gui's CMake config requires OpenGL headers via WrapOpenGL.
          # 24.04 pulls them in as a hard dependency of qt6-base-dev but
          # 22.04 only recommends them, and --no-install-recommends drops
          # them, so configure fails on OPENGL_INCLUDE_DIR. Asked for by
          # name instead of relying on either.
          #
          # Qt Charts and Qt SVG were renamed between 22.04 (libqt6*6-dev) and
          # 24.04 (qt6-*-dev), and the two names never coexist.
          pick() {
            for candidate in "$@"; do
              if apt-cache show "$candidate" 2>/dev/null | grep -q '^Package:'; then
                echo "$candidate"; return 0
              fi
            done
            echo "none of these exist here: $*" >&2; return 1
          }
          CHARTS=$(pick qt6-charts-dev libqt6charts6-dev)
          SVG=$(pick qt6-svg-dev libqt6svg6-dev)
          echo "using $CHARTS and $SVG"

          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libgl1-mesa-dev libegl1-mesa-dev \
            qt6-base-dev "$CHARTS" "$SVG" \
            libeigen3-dev nlohmann-json3-dev python3-dev

      - name: Qt
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          modules: qtcharts
          cache: true

      - name: Windows header-only dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Paths are the whole difficulty here. RUNNER_TEMP is a Windows path
          # ("D:\a\_temp") that bash mangles, so the dependencies go in the
          # workspace instead; and CMake is a Windows program, so it is handed
          # the mixed form ("D:/a/...") that cygpath produces while tar, cp and
          # curl keep the POSIX one.
          DEPS="$PWD/deps"
          DEPS_WIN="$(cygpath -m "$DEPS")"
          mkdir -p "$DEPS/src" "$DEPS/prefix/include"

          # Eigen ships no usable Eigen3Config.cmake in its source tarball, so
          # it is configured and installed rather than pointed at.
          curl -sL https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz \
            | tar xz -C "$DEPS/src"
          cmake -S "$DEPS_WIN/src/eigen-3.4.0" -B "$DEPS_WIN/eigen-build" \
            -DCMAKE_INSTALL_PREFIX="$DEPS_WIN/prefix" \
            -DBUILD_TESTING=OFF -DEIGEN_BUILD_DOC=OFF
          cmake --install "$DEPS_WIN/eigen-build"

          # nlohmann is found by the header search CMakeLists falls back to,
          # which looks under <prefix>/include.
          curl -sL -o "$DEPS/src/json.tar.xz" \
            https://github.com/nlohmann/json/releases/download/v3.11.3/json.tar.xz
          tar xf "$DEPS/src/json.tar.xz" -C "$DEPS/src"
          cp -r "$DEPS/src/json/include/nlohmann" "$DEPS/prefix/include/"

          echo "SIMUPY_PREFIX=$DEPS_WIN/prefix" >> "$GITHUB_ENV"

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA="-DCMAKE_PREFIX_PATH=$SIMUPY_PREFIX"
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable.replace(chr(92), "/"))')" \
            $EXTRA

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --timeout 180

      # The engine has no business needing Qt or an interpreter to compile.
      # A build that proves it is cheap; a layering violation found six months
      # from now is not.
      - name: Headless build (no GUI)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build-headless -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSIMUPY_BUILD_GUI=OFF
          cmake --build build-headless --parallel
          ctest --test-dir build-headless --output-on-failure --timeout 180

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt

      # -W turns a warning into a failure: a broken cross-reference or a
      # page missing from the toctree is a documentation bug like any other.
      - run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html

  lint:
    name: Generated files are up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Now that the block API is a real .py file rather than a C++ string,
      # it can be checked like one.
      - name: The embedded Python API is valid Python
        run: |
          python -m py_compile src/scripting/simupy_api.py
          python -m py_compile tools/fake_arduino.py tools/check_package.py
          python -m py_compile examples/make_examples.py examples/make_libraries.py
          python -m py_compile cmake/embed_text.py

      # The example models and the hardware library are generated. A change to
      # the generator that was never run leaves the two disagreeing, and the
      # difference only shows up when someone opens a stale file.
      - name: Regenerate and compare
        run: |
          cd examples
          python make_examples.py
          python make_libraries.py
          cd ..
          git diff --exit-code -- examples libraries
