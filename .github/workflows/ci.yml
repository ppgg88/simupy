name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-charts-dev qt6-svg-dev libgl1-mesa-dev \
            libeigen3-dev nlohmann-json3-dev \
            python3-dev python3-pybind11 python3-numpy

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      # Offscreen, but Qt still wants somewhere for its runtime files.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          ctest --test-dir build --output-on-failure --timeout 300

      # Proves the engine still compiles without Qt or an interpreter.
      - name: Headless build, without Qt
        run: |
          cmake -S . -B build-headless -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSIMUPY_BUILD_GUI=OFF
          cmake --build build-headless --parallel
          ctest --test-dir build-headless --output-on-failure --timeout 300

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-charts-dev qt6-svg-dev libgl1-mesa-dev \
            libeigen3-dev nlohmann-json3-dev \
            python3-dev python3-pybind11 python3-numpy

      - name: Configure
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSIMUPY_ENABLE_ASAN=ON

      - name: Build
        run: cmake --build build-asan --parallel

      # detect_leaks=0: the embedded interpreter never frees. The grep below
      # is needed because UBSan does not fail the process on a finding.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          set +e
          ctest --test-dir build-asan --output-on-failure --timeout 900 \
            2>&1 | tee sanitizer.log
          status=${PIPESTATUS[0]}
          set -e

          if grep -qE "ERROR: AddressSanitizer|runtime error:" sanitizer.log; then
            echo "::error::the sanitizers reported something; see the log above"
            exit 1
          fi
          exit "$status"

  windows:
    name: Build and test (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # NumPy is imported when the interpreter starts, so the suite needs it.
      - name: Python dependencies
        run: python -m pip install --upgrade pybind11 numpy pyserial

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          modules: qtcharts

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: ./.github/actions/windows-deps

      # Ninja and MSVC, to keep the layout single-config like the Linux job.
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --timeout 300

      # Proves the engine still compiles without Qt, as on Linux.
      - name: Headless build, without Qt
        shell: pwsh
        run: |
          cmake -S . -B build-headless -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DSIMUPY_BUILD_GUI=OFF
          cmake --build build-headless --parallel
          ctest --test-dir build-headless --output-on-failure --timeout 300

  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    # A literal path: the runner context does not exist this far up.
    env:
      XDG_RUNTIME_DIR: /tmp/simupy-xdg
    steps:
      - uses: actions/checkout@v4

      - name: Flatpak tooling
        run: |
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"

          sudo apt-get update
          # With recommends: eu-strip, patch, unzip and zstd are not depends.
          sudo apt-get install -y flatpak flatpak-builder

          # flatpak needs unprivileged user namespaces, refused by default here.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.kde.Sdk//6.9 org.kde.Platform//6.9

      # --disable-rofiles-fuse: the runner has no fuse device.
      - name: Build
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=repo build-dir \
            packaging/flatpak/io.github.ppgg88.SimuPy.yml

      - name: Bundle
        run: |
          flatpak build-bundle repo simupy.flatpak io.github.ppgg88.SimuPy \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Install and smoke-test the bundle
        run: |
          flatpak install --user -y --noninteractive simupy.flatpak

          # The second model imports NumPy, proving the sandbox found it.
          flatpak run --command=simupy-cli io.github.ppgg88.SimuPy \
            run /app/share/simupy/examples/pid_control_loop.spy --stop 2
          flatpak run --command=simupy-cli io.github.ppgg88.SimuPy \
            run /app/share/simupy/examples/python_lorenz.spy --stop 3

          # 124 means the window was still up after ten seconds.
          set +e
          timeout 10 flatpak run --env=QT_QPA_PLATFORM=offscreen \
            io.github.ppgg88.SimuPy \
            /app/share/simupy/examples/python_lorenz.spy --run
          status=$?
          set -e
          if [ "$status" != 124 ]; then
            echo "the application did not stay up (exit $status)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: simupy-flatpak
          path: simupy.flatpak
          if-no-files-found: error

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt

      - run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html

  lint:
    name: Generated files are up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GitHub rejects a bad workflow before any job runs; actionlint does not.
      - name: Workflow files are valid
        run: |
          curl -sSLo actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "$ACTIONLINT_SHA256  actionlint.tar.gz" | sha256sum --check
          tar xf actionlint.tar.gz actionlint
          ./actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

      - name: The embedded Python API is valid Python
        run: |
          python -m py_compile src/scripting/simupy_api.py
          python -m py_compile tools/fake_arduino.py tools/stamp_version.py
          python -m py_compile examples/make_examples.py examples/make_libraries.py
          python -m py_compile cmake/embed_text.py

      # A generator changed but never run leaves stale files in the tree.
      - name: Regenerate and compare
        run: |
          cd examples
          python make_examples.py
          python make_libraries.py
          cd ..
          git diff --exit-code -- examples libraries

      - name: Desktop and AppStream metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils appstream
          desktop-file-validate packaging/io.github.ppgg88.SimuPy.desktop
          appstreamcli validate --no-net --pedantic \
            packaging/io.github.ppgg88.SimuPy.metainfo.xml
