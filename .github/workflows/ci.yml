name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Linux only, on one image, with every dependency coming from apt. Nothing
# here resolves a package name at run time or juggles two distribution
# releases: when this breaks it is because the code broke.
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-charts-dev qt6-svg-dev libgl1-mesa-dev \
            libeigen3-dev nlohmann-json3-dev \
            python3-dev python3-pybind11 python3-numpy

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      # The GUI tests drive real windows on the offscreen platform plugin, so
      # no display is needed — but Qt still wants somewhere to put its
      # runtime files.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          ctest --test-dir build --output-on-failure --timeout 300

      # The engine has no business needing Qt or an interpreter to compile.
      # A build that proves it is cheap; a layering violation found six months
      # from now is not.
      - name: Headless build, without Qt
        run: |
          cmake -S . -B build-headless -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSIMUPY_BUILD_GUI=OFF
          cmake --build build-headless --parallel
          ctest --test-dir build-headless --output-on-failure --timeout 300

  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    # flatpak wants somewhere to put a sandbox's runtime files; the runner
    # leaves the variable unset. A literal path, because the runner context
    # does not exist this far up.
    env:
      XDG_RUNTIME_DIR: /tmp/simupy-xdg
    steps:
      - uses: actions/checkout@v4

      - name: Flatpak tooling
        run: |
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"

          sudo apt-get update
          # Deliberately *with* recommends: elfutils (eu-strip, run over every
          # binary staged), patch, unzip, xz-utils and zstd are recommends of
          # flatpak-builder rather than depends, and it only discovers they
          # are missing once it is deep into a build.
          sudo apt-get install -y flatpak flatpak-builder

          # Ubuntu 24.04 refuses unprivileged user namespaces by default and
          # both flatpak-builder and flatpak run are built on them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.kde.Sdk//6.9 org.kde.Platform//6.9

      # The same command a developer runs locally. --disable-rofiles-fuse
      # because the runner has no fuse device.
      - name: Build
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=repo build-dir \
            packaging/flatpak/io.github.ppgg88.SimuPy.yml

      - name: Bundle
        run: |
          flatpak build-bundle repo simupy.flatpak io.github.ppgg88.SimuPy \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      # An application that builds and then fails to start is the failure
      # this whole job exists to catch, so the bundle is installed and run.
      - name: Install and smoke-test the bundle
        run: |
          flatpak install --user -y --noninteractive simupy.flatpak

          # The engine, then a model whose block is Python and imports NumPy:
          # that one proves the interpreter inside the sandbox found the
          # packages installed beside it.
          flatpak run --command=simupy-cli io.github.ppgg88.SimuPy \
            run /app/share/simupy/examples/pid_control_loop.spy --stop 2
          flatpak run --command=simupy-cli io.github.ppgg88.SimuPy \
            run /app/share/simupy/examples/python_lorenz.spy --stop 3

          # And the window: opened offscreen on a model, left running, and
          # expected to still be there ten seconds later. `timeout` reports
          # 124 for that; any other status means it fell over on startup.
          set +e
          timeout 10 flatpak run --env=QT_QPA_PLATFORM=offscreen \
            io.github.ppgg88.SimuPy \
            /app/share/simupy/examples/python_lorenz.spy --run
          status=$?
          set -e
          if [ "$status" != 124 ]; then
            echo "the application did not stay up (exit $status)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: simupy-flatpak
          path: simupy.flatpak
          if-no-files-found: error

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt

      # -W turns a warning into a failure: a broken cross-reference or a
      # page missing from the toctree is a documentation bug like any other.
      - run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html

  lint:
    name: Generated files are up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A workflow file with a bad expression in it is rejected by GitHub
      # before a single job starts, which makes it the one kind of breakage
      # the pipeline cannot report on itself. actionlint reads them the same
      # way GitHub does.
      - name: Workflow files are valid
        run: |
          curl -sSLo actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "$ACTIONLINT_SHA256  actionlint.tar.gz" | sha256sum --check
          tar xf actionlint.tar.gz actionlint
          ./actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

      - name: The embedded Python API is valid Python
        run: |
          python -m py_compile src/scripting/simupy_api.py
          python -m py_compile tools/fake_arduino.py tools/stamp_version.py
          python -m py_compile examples/make_examples.py examples/make_libraries.py
          python -m py_compile cmake/embed_text.py

      # The example models and the hardware library are generated. A change to
      # the generator that was never run leaves the two disagreeing, and the
      # difference only shows up when someone opens a stale file.
      - name: Regenerate and compare
        run: |
          cd examples
          python make_examples.py
          python make_libraries.py
          cd ..
          git diff --exit-code -- examples libraries

      # The desktop entry and the AppStream data are what a software centre
      # reads; a typo in either is only visible once installed.
      - name: Desktop and AppStream metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils appstream
          desktop-file-validate packaging/io.github.ppgg88.SimuPy.desktop
          appstreamcli validate --no-net --pedantic \
            packaging/io.github.ppgg88.SimuPy.metainfo.xml
