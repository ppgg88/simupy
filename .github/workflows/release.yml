name: Release

on:
  push:
    tags: ["v*"]
  # Builds and uploads the assets without publishing, so the pipeline can be
  # exercised without cutting a release.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on the packages, without the leading v"
        default: "0.0.0-dev"

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04   # oldest supported glibc, so the tarball runs widely
          - name: Windows
            os: windows-2022

    steps:
      - uses: actions/checkout@v4

      # The assets carry the tag, not the version last committed to CMakeLists.
      - name: Version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "SIMUPY_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "building $VERSION"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip pybind11 numpy pyserial

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build file \
            qt6-base-dev qt6-charts-dev qt6-svg-dev \
            libeigen3-dev nlohmann-json3-dev python3-dev

      - name: Qt
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          modules: qtcharts
          cache: true

      - name: Windows header-only dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Paths are the whole difficulty here. RUNNER_TEMP is a Windows path
          # ("D:\a\_temp") that bash mangles, so the dependencies go in the
          # workspace instead; and CMake is a Windows program, so it is handed
          # the mixed form ("D:/a/...") that cygpath produces while tar, cp and
          # curl keep the POSIX one.
          DEPS="$PWD/deps"
          DEPS_WIN="$(cygpath -m "$DEPS")"
          mkdir -p "$DEPS/src" "$DEPS/prefix/include"

          # Eigen ships no usable Eigen3Config.cmake in its source tarball, so
          # it is configured and installed rather than pointed at.
          curl -sL https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz \
            | tar xz -C "$DEPS/src"
          cmake -S "$DEPS_WIN/src/eigen-3.4.0" -B "$DEPS_WIN/eigen-build" \
            -DCMAKE_INSTALL_PREFIX="$DEPS_WIN/prefix" \
            -DBUILD_TESTING=OFF -DEIGEN_BUILD_DOC=OFF
          cmake --install "$DEPS_WIN/eigen-build"

          # nlohmann is found by the header search CMakeLists falls back to,
          # which looks under <prefix>/include.
          curl -sL -o "$DEPS/src/json.tar.xz" \
            https://github.com/nlohmann/json/releases/download/v3.11.3/json.tar.xz
          tar xf "$DEPS/src/json.tar.xz" -C "$DEPS/src"
          cp -r "$DEPS/src/json/include/nlohmann" "$DEPS/prefix/include/"

          echo "SIMUPY_PREFIX=$DEPS_WIN/prefix" >> "$GITHUB_ENV"

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Configure and build
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA="-DCMAKE_PREFIX_PATH=$SIMUPY_PREFIX"
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSIMUPY_VERSION="$SIMUPY_VERSION" \
            -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable.replace(chr(92), "/"))')" \
            $EXTRA
          cmake --build build --parallel

      # Shipping something that was never run is how a broken release happens.
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --timeout 180

      - name: Package (Linux)
        if: runner.os == 'Linux'
        working-directory: build
        run: cpack -G "TGZ;DEB"

      # The Qt and Python runtimes come in from install rules, so they land in
      # the package rather than only beside the build output.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        run: cpack -G "ZIP;NSIS"

      # A package missing its runtime still zips up fine and only fails on the
      # user's machine, so the contents are checked here instead.
      - name: Verify package contents
        shell: bash
        run: |
          python "$GITHUB_WORKSPACE/tools/check_package.py" build

      - name: Collect assets
        shell: bash
        run: |
          mkdir -p assets
          find build -maxdepth 1 \
            \( -name "simupy*.tar.gz" -o -name "simupy*.deb" \
               -o -name "simupy*.zip" -o -name "simupy*.exe" \) \
            -exec cp {} assets/ \;
          ls -lh assets

      - uses: actions/upload-artifact@v4
        with:
          name: simupy-${{ matrix.name }}
          path: assets/*
          if-no-files-found: error

  release:
    name: Publish
    needs: package
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        run: |
          cd assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          body: |
            ## Installing

            **Linux (Debian, Ubuntu)** — `sudo apt install ./simupy_*_amd64.deb`.
            Qt, Python and NumPy come in as dependencies.

            **Linux (any distribution)** — unpack the `.tar.gz`. It needs Qt 6.2+,
            Python 3.8+ and NumPy already present.

            **Windows** — run the `.exe` installer, or unpack the `.zip` to run it
            in place. Qt and the Python runtime are bundled; install NumPy with
            `pip install numpy` for Python blocks to work.

            `pyserial` is only needed for the Arduino and serial blocks.
