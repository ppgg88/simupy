name: Release

on:
  push:
    tags: ["v*"]
  # Builds the bundle without publishing, to exercise the pipeline.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on the bundle, without the leading v"
        default: "0.0.0-dev"

permissions:
  contents: write

jobs:
  # The Flatpak build skips the suite, so it runs here.
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-charts-dev qt6-svg-dev libgl1-mesa-dev \
            libeigen3-dev nlohmann-json3-dev \
            python3-dev python3-pybind11 python3-numpy

      - name: Build and test
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure --timeout 300

  package:
    name: Flatpak bundle
    needs: test
    runs-on: ubuntu-24.04
    # A literal path: the runner context does not exist this far up.
    env:
      XDG_RUNTIME_DIR: /tmp/simupy-xdg
    steps:
      - uses: actions/checkout@v4

      # The bundle carries the tag, not the version last committed.
      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "SIMUPY_VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 tools/stamp_version.py "$VERSION"

      - name: Flatpak tooling
        run: |
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"

          sudo apt-get update
          # With recommends: eu-strip, patch, unzip and zstd are not depends.
          sudo apt-get install -y flatpak flatpak-builder

          # flatpak needs unprivileged user namespaces, refused by default here.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.kde.Sdk//6.9 org.kde.Platform//6.9

      - name: Build
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=repo build-dir \
            packaging/flatpak/io.github.ppgg88.SimuPy.yml

      - name: Bundle
        run: |
          flatpak build-bundle repo \
            "simupy-${SIMUPY_VERSION}-x86_64.flatpak" \
            io.github.ppgg88.SimuPy \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Install and smoke-test the bundle
        run: |
          flatpak install --user -y --noninteractive \
            "simupy-${SIMUPY_VERSION}-x86_64.flatpak"

          # The second model imports NumPy, proving the sandbox found it.
          flatpak run --command=simupy-cli io.github.ppgg88.SimuPy \
            run /app/share/simupy/examples/pid_control_loop.spy --stop 2
          flatpak run --command=simupy-cli io.github.ppgg88.SimuPy \
            run /app/share/simupy/examples/python_lorenz.spy --stop 3

          # Or the stamping silently did nothing.
          flatpak run --env=QT_QPA_PLATFORM=offscreen \
            io.github.ppgg88.SimuPy --version | grep -F "$SIMUPY_VERSION"

          # 124 means the window was still up after ten seconds.
          set +e
          timeout 10 flatpak run --env=QT_QPA_PLATFORM=offscreen \
            io.github.ppgg88.SimuPy \
            /app/share/simupy/examples/python_lorenz.spy --run
          status=$?
          set -e
          if [ "$status" != 124 ]; then
            echo "the application did not stay up (exit $status)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: simupy-flatpak
          path: simupy-*.flatpak
          if-no-files-found: error

  publish:
    name: Publish
    needs: package
    runs-on: ubuntu-24.04
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: simupy-flatpak
          path: assets

      - name: Checksums
        run: |
          cd assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          body: |
            ## Installing

            Download the `.flatpak` bundle and install it:

            ```sh
            flatpak install --user ./simupy-*.flatpak
            flatpak run io.github.ppgg88.SimuPy
            ```

            It needs Flatpak with the Flathub remote configured — the KDE 6.9
            runtime is pulled in from there. Qt, Python 3.12, NumPy and
            pyserial all travel inside the bundle or its runtime, so nothing
            else has to be installed.

            Serial and UDP blocks work out of the box; models are read from
            and written to your home directory.
